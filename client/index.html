<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f14" />
    <title>OS Todo</title>
    <meta name="description" content="A calm, hierarchical daily to-do list with templates, streaks, and deadlines." />
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&family=Inter+Tight:wght@500..700&family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
    <!-- Applies the saved theme before first paint; client/src/lib/theme.ts drives it at runtime. -->
    <script>
      (() => {
        const m = matchMedia("(prefers-color-scheme: dark)");
        const pref = () => { try { return localStorage.getItem("theme") || "system"; } catch { return "system"; } };
        const apply = () => {
          const p = pref();
          document.documentElement.classList.toggle("dark", p === "dark" || (p === "system" && m.matches));
        };
        apply();
        m.addEventListener("change", apply);
        window.__applyTheme = apply;
      })();
    </script>
  </head>
  <body class="flex min-h-dvh flex-col antialiased">
    <div id="root" class="flex min-h-dvh flex-1 flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
